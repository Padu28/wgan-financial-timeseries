name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test (includes analytic gradient checks)
        run: pytest
      - name: Short training smoke test
        run: |
          tempora data simulate --days 900 --out /tmp/p.csv
          tempora train --data /tmp/p.csv --iterations 50 --output /tmp/o --models /tmp/m --dashboard /tmp/d.js
